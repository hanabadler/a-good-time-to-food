version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tomer-app-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=file:./prisma/dev.db
      - NODE_ENV=production
    volumes:
      # Persist database
      - ./server/prisma:/app/prisma
    restart: unless-stopped
    networks:
      - tomer-app-network
    healthcheck:
      # Consume response (r.resume()) and handle connection errors so the check never hangs
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/family-members', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: tomer-app-client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tomer-app-network

networks:
  tomer-app-network:
    driver: bridge
