version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tomer-app-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=file:./prisma/dev.db
      - NODE_ENV=production
    volumes:
      # Persist database
      - ./server/prisma:/app/prisma
    restart: unless-stopped
    networks:
      - tomer-app-network
    healthcheck:
      # TCP check: server is healthy when it listens on 3001 (avoids HTTP/DB issues during startup)
      test: ["CMD", "node", "-e", "require('net').createConnection(3001, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: tomer-app-client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tomer-app-network

networks:
  tomer-app-network:
    driver: bridge
